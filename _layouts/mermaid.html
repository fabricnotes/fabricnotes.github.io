---
layout: default
---

{{ content }}

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
  const diagrams = Array.from(document.querySelectorAll("pre code.language-mermaid"), (code) => {
    const diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.textContent = code.textContent;
    diagram.style.overflowX = "auto";
    code.closest("pre").replaceWith(diagram);
    return { element: diagram, source: code.textContent };
  });

  async function renderDiagrams() {
    mermaid.initialize({
      startOnLoad: false,
      theme: colorScheme.matches ? "dark" : "neutral",
      securityLevel: "strict"
    });

    for (const { element, source } of diagrams) {
      element.removeAttribute("data-processed");
      element.textContent = source;
    }

    await mermaid.run({ nodes: diagrams.map(({ element }) => element) });
  }

  colorScheme.addEventListener("change", renderDiagrams);
  await renderDiagrams();
</script>
